<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my-tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #1a1a1a;
    background: #fafafa;
  }
  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 80vh;
    padding: 2rem;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff;
  }
  header h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    margin-bottom: 1rem;
  }
  header p {
    font-size: clamp(1rem, 2vw, 1.25rem);
    max-width: 600px;
    opacity: 0.9;
    margin-bottom: 2rem;
  }
  .cta {
    display: inline-block;
    padding: 0.9rem 2rem;
    background: #fff;
    color: #4f46e5;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    transition: transform 0.15s ease;
  }
  .cta:hover { transform: translateY(-2px); }
  section {
    max-width: 900px;
    margin: 0 auto;
    padding: 4rem 2rem;
  }
  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 2rem;
  }
  .feature h3 { margin-bottom: 0.5rem; color: #4f46e5; }
  footer {
    text-align: center;
    padding: 2rem;
    color: #888;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <header>
    <h1>Hello Vercel</h1>
    <p>シンプルで使いやすいツールで、日々の作業をもっとスムーズに。</p>
    <a class="cta" href="#features">詳しく見る</a>
  </header>

  <section id="features">
    <div class="features">
      <div class="feature">
        <h3>シンプル</h3>
        <p>余計な機能を省き、必要なものだけを提供します。</p>
      </div>
      <div class="feature">
        <h3>高速</h3>
        <p>軽量な作りで、ストレスなく動作します。</p>
      </div>
      <div class="feature">
        <h3>オープンソース</h3>
        <p>GitHub上で開発され、誰でも自由に利用できます。</p>
      </div>
    </div>
  </section>

  <footer>
    &copy; 2026 my-tool
  </footer>
</body>
</html>
